name: Affiliate Link Audit

on:
  schedule:
    # Every Monday at 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run affiliate link audit
        id: audit
        run: node scripts/audit-affiliate-links.mjs
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-link-audit-report
          path: reports/affiliate-link-audit.txt
          if-no-files-found: warn

      - name: Publish report to job summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.audit.outcome }}';

            let report = '_(report file not found — the audit script may have crashed)_';
            let raw = '';
            try {
              raw = fs.readFileSync('reports/affiliate-link-audit.txt', 'utf8');
              // GitHub job summaries cap at ~1 MiB. Keep well under that so the
              // summary always renders even when the OK list grows long.
              report = raw.length > 60000 ? raw.slice(0, 60000) + '\n...[truncated, see uploaded artifact for full report]' : raw;
            } catch (err) {
              core.warning(`Could not read report: ${err.message}`);
            }

            // Detect what kinds of "needs attention" entries the audit
            // surfaced so the summary heading and intro line tell the
            // maintainer at a glance what changed.
            const hasBroken = /^Broken \/ non-2xx:\s+([1-9]\d*)$/m.test(raw);
            const hasBrandChange = /^Brand-change redirects:\s+([1-9]\d*)$/m.test(raw);

            let heading;
            let intro;
            if (outcome === 'failure') {
              const flagged = [];
              if (hasBroken) flagged.push('broken links');
              if (hasBrandChange) flagged.push('brand-change redirects');
              const flaggedText = flagged.length ? flagged.join(' and ') : 'issues';
              heading = `❌ Affiliate Link Audit — ${flaggedText} found`;
              intro = hasBrandChange
                ? 'One or more affiliate links silently redirect to a different brand/domain. Update or remove them — see the **BRAND-CHANGE REDIRECTS** section of the report.'
                : 'Full report is also attached as the `affiliate-link-audit-report` workflow artifact.';
            } else {
              heading = '✅ Affiliate Link Audit — no broken links or brand-change redirects';
              intro = 'Full report is also attached as the `affiliate-link-audit-report` workflow artifact.';
            }

            await core.summary
              .addHeading(heading)
              .addRaw(intro)
              .addEOL()
              .addCodeBlock(report, 'text')
              .write();

      - name: Open issue on broken links
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '_(report file not found)_';
            let raw = '';
            try {
              raw = fs.readFileSync('reports/affiliate-link-audit.txt', 'utf8');
              report = raw.length > 60000 ? raw.slice(0, 60000) + '\n...[truncated]' : raw;
            } catch (err) {
              core.warning(`Could not read report: ${err.message}`);
            }

            const hasBroken = /^Broken \/ non-2xx:\s+([1-9]\d*)$/m.test(raw);
            const hasBrandChange = /^Brand-change redirects:\s+([1-9]\d*)$/m.test(raw);

            const flagged = [];
            if (hasBroken) flagged.push('broken links');
            if (hasBrandChange) flagged.push('brand-change redirects');
            const flaggedText = flagged.length ? flagged.join(' and ') : 'issues';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `Affiliate link audit found ${flaggedText} (${today})`;
            const intro = hasBrandChange
              ? `The weekly affiliate link audit detected ${flaggedText}. **Brand-change redirects** mean an affiliate URL silently lands on a completely different domain — the original destination is effectively dead. See the **BRAND-CHANGE REDIRECTS** section below and update or remove those links.`
              : `The weekly affiliate link audit detected ${flaggedText}.`;
            const body = [
              intro,
              ``,
              `Workflow run: ${runUrl}`,
              ``,
              '```',
              report,
              '```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'affiliate-audit',
              per_page: 100,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.info(`Commented on existing issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['affiliate-audit'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Fail job if audit failed
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Affiliate link audit reported broken links and/
