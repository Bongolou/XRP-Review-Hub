name: Affiliate Link Audit

on:
  schedule:
    # Every Monday at 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run affiliate link audit
        id: audit
        run: node scripts/audit-affiliate-links.mjs
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-link-audit-report
          path: reports/affiliate-link-audit.txt
          if-no-files-found: warn

      - name: Open issue on broken links
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '_(report file not found)_';
            try {
              const raw = fs.readFileSync('reports/affiliate-link-audit.txt', 'utf8');
              report = raw.length > 60000 ? raw.slice(0, 60000) + '\n...[truncated]' : raw;
            } catch (err) {
              core.warning(`Could not read report: ${err.message}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `Affiliate link audit found broken links (${today})`;
            const body = [
              `The weekly affiliate link audit detected broken links.`,
              ``,
              `Workflow run: ${runUrl}`,
              ``,
              '```',
              report,
              '```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'affiliate-audit',
              per_page: 100,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.info(`Commented on existing issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['affiliate-audit'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Fail job if audit failed
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Affiliate link audit reported broken links. See uploaded report and the opened issue."
          exit 1
