name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:

# A fast-follow push should supersede the in-flight deploy rather than
# race it (which can leave the live site briefly serving an older build).
concurrency:
  group: deploy-bluehost
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The build step calls script/prerender.ts, which launches a
      # headless Chromium via Playwright to snapshot every public route
      # to static HTML. The browser binary and its system libraries
      # are NOT installed by `npm ci`, so install them explicitly here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check browser metadata regressions
        run: npm run test:browser

      - name: Check Bluehost relay regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl
          npx vitest run script/backend-relay.test.ts script/backend-client.test.ts server/welcomeEmail.test.ts

      - name: Build site
        env:
          BLUEHOST_DEPLOY: "1"
        run: npm run build

      - name: Test post-deploy smoke checker
        run: python3 -m unittest discover -s script -p 'post_deploy_smoke_test.py'

      - name: Deploy dist/public to Bluehost over FTPS
        # Pinned to a specific minor of a well-maintained, widely-used
        # FTP deploy action. dangerous-clean-slate is intentionally
        # left at its default (false) so the action only syncs the
        # built bundle and leaves any user-managed files in the
        # destination (e.g. a hand-edited .htaccess, cgi-bin/, etc.)
        # untouched.
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          server-dir: ${{ secrets.BLUEHOST_FTP_SERVER_DIR }}
          local-dir: ./dist/public/
          protocol: ftps
          # Skip files we never want to ship even if they sneak into
          # dist/public/ for some reason.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      # Only public GET requests: no submissions, admin calls, or emails.
      # A 200 SPA fallback is a failure, not proof the backend relay works.
      - name: Check live Bluehost routes
        timeout-minutes: 10
        run: python3 script/post_deploy_smoke.py

      - name: Summarize deploy
        if: always()
        run: |
          echo "### Deploy to Bluehost" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: \`${GITHUB_EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Finished at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dynamic routes are relayed to the public Replit backend; publish backend changes separately." >> "$GITHUB_STEP_SUMMARY"
          echo "- Result (including read-only live route checks): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
